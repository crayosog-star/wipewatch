<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Wipewatch overlay</title>
<style>
  html,body{margin:0;background:transparent;overflow:hidden;font:13px/1.35 "Segoe UI",system-ui,sans-serif;color:#eef1f8;user-select:none}
  .ov{margin:6px;padding:10px 12px 11px;border-radius:14px;background:linear-gradient(160deg,rgba(24,28,42,.94),rgba(12,14,22,.94));border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 24px rgba(0,0,0,.45);-webkit-app-region:drag}
  .top{display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .top img{width:18px;height:18px;border-radius:5px}
  .top b{font-size:11px;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(90deg,#ff9a3d,#ff3d6e);-webkit-background-clip:text;background-clip:text;color:transparent}
  .big{font-size:25px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
  .lbl{color:#8f98ad;font-size:11px}
  .row{display:flex;justify-content:space-between;gap:10px;margin-top:6px;align-items:baseline}
  .sv{margin-top:6px;display:flex;justify-content:space-between;gap:8px;font-size:12px}
  .sv span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:118px}
  .sv span:last-child{white-space:nowrap}
  .up{color:#3ddc97}.down{color:#ff5d6c}.q{color:#ffb454}
</style></head>
<body><div class="ov" id="ov"></div><script src="overlay.js"></script></body></html>
