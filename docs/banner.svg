<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Wipewatch - your Rust companion">
  <title>Wipewatch - your Rust companion</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d14"/><stop offset="1" stop-color="#171124"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity=".55"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="660" y2="0">
      <stop offset="0" stop-color="#ff9a3d"/><stop offset=".5" stop-color="#ff5a4a"/><stop offset="1" stop-color="#ff3d6e"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-160 0;160 0;-160 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="chute" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffd9c4"/></linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a3d" stop-opacity=".22"/><stop offset="1" stop-color="#ff3d6e" stop-opacity=".18"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <clipPath id="clip"><rect width="1200" height="380" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <!-- ground glow that flares on impact -->
    <ellipse cx="930" cy="318" rx="300" ry="90" fill="url(#glow)" opacity=".35">
      <animate attributeName="opacity" values=".25;.25;.9;.4;.25" keyTimes="0;.33;.37;.6;1" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <!-- falling streaks -->
    <g stroke="#ffb27a" stroke-linecap="round" opacity=".5">
      <path d="M820 -60V-10" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="0 0;0 420" dur="1.8s" repeatCount="indefinite"/></path>
      <path d="M900 -120V-70" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="0 0;0 480" dur="2.3s" repeatCount="indefinite"/></path>
      <path d="M1010 -90V-40" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="0 0;0 450" dur="2s" repeatCount="indefinite"/></path>
      <path d="M1100 -150V-100" stroke-width="2"><animateTransform attributeName="transform" type="translate" values="0 0;0 520" dur="2.6s" repeatCount="indefinite"/></path>
    </g>

    <!-- ===== the supply drop ===== -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -330;0 0;0 0;0 0" keyTimes="0;.33;.9;1" calcMode="spline" keySplines=".3 .1 .7 1;0 0 1 1;0 0 1 1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.9;1" dur="7s" repeatCount="indefinite"/>
      <g transform="translate(800 40)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-7 128 150;6 128 150;-3 128 150;0 128 150;0 128 150" keyTimes="0;.12;.24;.33;1" dur="7s" repeatCount="indefinite"/>
          <!-- chute (falls away and fades after impact) -->
          <g>
            <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 38;0 38" keyTimes="0;.33;.42;1" dur="7s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.33;.42;1" dur="7s" repeatCount="indefinite"/>
            <path d="M42 120 C42 70 80 38 128 38 C176 38 214 70 214 120 Q192 104 171 120 Q150 104 128 120 Q106 104 85 120 Q64 104 42 120 Z" fill="url(#chute)"/>
            <path d="M128 38 C107 60 98 92 85 120 M128 38 C149 60 158 92 171 120 M128 38 V120" stroke="#ff5a4a" stroke-opacity=".4" stroke-width="5" fill="none" stroke-linecap="round"/>
            <path d="M42 120 L106 178 M85 120 L114 178 M128 120 V178 M171 120 L142 178 M214 120 L150 178" stroke="#fff" stroke-opacity=".9" stroke-width="4" fill="none" stroke-linecap="round"/>
          </g>
          <!-- crate -->
          <g>
            <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 5;0 0;0 0" keyTimes="0;.33;.36;.4;1" dur="7s" repeatCount="indefinite"/>
            <rect x="100" y="176" width="56" height="48" rx="9" fill="#171b27"/>
            <path d="M100 200h56M128 176v48" stroke="#ff9a5c" stroke-width="5"/>
            <rect x="100" y="176" width="56" height="48" rx="9" fill="none" stroke="#ff9a5c" stroke-width="4"/>
          </g>
        </g>
      </g>
    </g>

    <!-- impact: shockwave rings + sparks -->
    <g transform="translate(928 274)" fill="none">
      <ellipse rx="10" ry="3" stroke="#ff9a3d" stroke-width="3" opacity="0">
        <animate attributeName="rx" values="10;10;230;230" keyTimes="0;.33;.52;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="3;3;60;60" keyTimes="0;.33;.52;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;.95;0;0" keyTimes="0;.32;.33;.52;1" dur="7s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="10" ry="3" stroke="#ff3d6e" stroke-width="2" opacity="0">
        <animate attributeName="rx" values="10;10;160;160" keyTimes="0;.35;.55;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="3;3;42;42" keyTimes="0;.35;.55;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;.8;0;0" keyTimes="0;.34;.35;.55;1" dur="7s" repeatCount="indefinite"/>
      </ellipse>
      <g fill="#ffb27a">
        <circle r="4"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;-120 -90;-150 -20" keyTimes="0;.33;.45;.6" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.33;.36;.6" dur="7s" repeatCount="indefinite"/></circle>
        <circle r="3" fill="#ff5a4a"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;-60 -120;-80 -30" keyTimes="0;.33;.45;.6" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.33;.36;.6" dur="7s" repeatCount="indefinite"/></circle>
        <circle r="4" fill="#fff"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -140;0 -40" keyTimes="0;.33;.45;.6" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.33;.36;.6" dur="7s" repeatCount="indefinite"/></circle>
        <circle r="3" fill="#ff3d6e"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;70 -125;90 -30" keyTimes="0;.33;.45;.6" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.33;.36;.6" dur="7s" repeatCount="indefinite"/></circle>
        <circle r="4"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;130 -85;165 -15" keyTimes="0;.33;.45;.6" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.33;.36;.6" dur="7s" repeatCount="indefinite"/></circle>
      </g>
    </g>

    <!-- ===== title block ===== -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <g transform="translate(64 78)">
        <rect width="58" height="58" rx="14" fill="#ff7a3d"/>
        <rect width="58" height="58" rx="14" fill="url(#title)"/>
        <path d="M10 28 C10 17 18 10 29 10 C40 10 48 17 48 28 Q43 24 38 28 Q34 24 29 28 Q24 24 19 28 Q14 24 10 28 Z" fill="#fff"/>
        <path d="M29 28 V40 M19 28 L25 40 M38 28 L33 40" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
        <rect x="24" y="40" width="10" height="9" rx="2" fill="#171b27" stroke="#ffd9c4" stroke-width="1.4"/>
      </g>
      <text x="138" y="124" font-size="64" font-weight="800" letter-spacing="3" fill="url(#title)">WIPEWATCH</text>
      <text x="66" y="176" font-size="24" fill="#c7cde0" font-weight="500">Your Rust companion for Windows</text>
      <text x="66" y="208" font-size="16.5" fill="#8f98ad">Drops · Skins · Servers · Friends &amp; Clans · Build Ideas · Wipe Planner</text>

      <!-- feature chips, lighting up one after another -->
      <g font-size="14.5" font-weight="600" fill="#ffd9c4">
        <g transform="translate(66 250)"><rect width="104" height="34" rx="17" fill="url(#chip)" stroke="#ff9a3d" stroke-opacity=".45"/><text x="52" y="22" text-anchor="middle">Drops</text><animate attributeName="opacity" values=".45;1;.45;.45" keyTimes="0;.06;.2;1" dur="7s" repeatCount="indefinite"/></g>
        <g transform="translate(180 250)"><rect width="96" height="34" rx="17" fill="url(#chip)" stroke="#ff9a3d" stroke-opacity=".45"/><text x="48" y="22" text-anchor="middle">Skins</text><animate attributeName="opacity" values=".45;.45;1;.45;.45" keyTimes="0;.08;.14;.28;1" dur="7s" repeatCount="indefinite"/></g>
        <g transform="translate(286 250)"><rect width="116" height="34" rx="17" fill="url(#chip)" stroke="#ff9a3d" stroke-opacity=".45"/><text x="58" y="22" text-anchor="middle">Servers</text><animate attributeName="opacity" values=".45;.45;1;.45;.45" keyTimes="0;.16;.22;.36;1" dur="7s" repeatCount="indefinite"/></g>
        <g transform="translate(412 250)"><rect width="150" height="34" rx="17" fill="url(#chip)" stroke="#ff9a3d" stroke-opacity=".45"/><text x="75" y="22" text-anchor="middle">Friends &amp; Clans</text><animate attributeName="opacity" values=".45;.45;1;.45;.45" keyTimes="0;.24;.3;.44;1" dur="7s" repeatCount="indefinite"/></g>
        <g transform="translate(66 294)"><rect width="128" height="34" rx="17" fill="url(#chip)" stroke="#ff9a3d" stroke-opacity=".45"/><text x="64" y="22" text-anchor="middle">Build Ideas</text><animate attributeName="opacity" values=".45;.45;1;.45;.45" keyTimes="0;.32;.38;.52;1" dur="7s" repeatCount="indefinite"/></g>
        <g transform="translate(204 294)"><rect width="140" height="34" rx="17" fill="url(#chip)" stroke="#ff9a3d" stroke-opacity=".45"/><text x="70" y="22" text-anchor="middle">Wipe Planner</text><animate attributeName="opacity" values=".45;.45;1;.45;.45" keyTimes="0;.4;.46;.6;1" dur="7s" repeatCount="indefinite"/></g>
        <g transform="translate(354 294)"><rect width="104" height="34" rx="17" fill="url(#chip)" stroke="#ff9a3d" stroke-opacity=".45"/><text x="52" y="22" text-anchor="middle">Raid Calc</text><animate attributeName="opacity" values=".45;.45;1;.45;.45" keyTimes="0;.48;.54;.68;1" dur="7s" repeatCount="indefinite"/></g>
        <g transform="translate(468 294)"><rect width="104" height="34" rx="17" fill="url(#chip)" stroke="#ff9a3d" stroke-opacity=".45"/><text x="52" y="22" text-anchor="middle">Patch Notes</text><animate attributeName="opacity" values=".45;.45;1;.45;.45" keyTimes="0;.56;.62;.76;1" dur="7s" repeatCount="indefinite"/></g>
      </g>
    </g>
    <rect width="1200" height="380" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  </g>
</svg>
